<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Memory Manager</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-2: #eef2f7;
      --line: #d7dde8;
      --text: #1c2430;
      --muted: #657084;
      --blue: #2563eb;
      --green: #078669;
      --yellow: #a86500;
      --red: #c2413b;
      --focus: #8ab4ff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      line-height: 1.45;
    }
    header {
      border-bottom: 1px solid var(--line);
      background: #ffffff;
    }
    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 18px 20px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }
    .status {
      color: var(--muted);
      font-size: 13px;
      min-height: 20px;
      text-align: right;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }
    .stat {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      padding: 12px;
    }
    .stat strong {
      display: block;
      font-size: 24px;
      margin-bottom: 2px;
    }
    .stat span {
      color: var(--muted);
      font-size: 12px;
    }
    main.shell {
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    section {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
      min-width: 0;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
    }
    h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }
    form {
      padding: 14px;
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
      min-height: 40px;
    }
    textarea {
      resize: vertical;
      min-height: 96px;
    }
    input:focus, select:focus, textarea:focus, button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 1px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid transparent;
      background: var(--blue);
      color: #ffffff;
      border-radius: 6px;
      padding: 9px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      min-height: 38px;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--line);
    }
    button.danger {
      background: transparent;
      color: var(--red);
      border-color: rgba(194, 65, 59, 0.4);
    }
    button.success {
      background: transparent;
      color: var(--green);
      border-color: rgba(7, 134, 105, 0.4);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .toolbar label {
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: none;
      font-weight: 400;
    }
    .toolbar input[type="search"] {
      width: min(320px, 45vw);
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 220px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 920px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel-2);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    tr.archived {
      color: #8a94a8;
      background: rgba(255, 255, 255, 0.02);
    }
    .fact {
      max-width: 420px;
      word-break: break-word;
    }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .row-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 180px;
    }
    .row-actions button {
      padding: 6px 8px;
      min-height: 30px;
      font-size: 12px;
    }
    .tasks {
      margin-top: 16px;
    }
    .task-list {
      padding: 12px 14px;
      display: grid;
      gap: 8px;
      max-height: 240px;
      overflow: auto;
    }
    .task {
      border: 1px solid var(--line);
      background: #121722;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
    }
    .task-meta {
      color: var(--muted);
      margin-top: 4px;
      font-size: 12px;
    }
    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 900px) {
      .stats, main.shell {
        grid-template-columns: 1fr;
      }
      .toolbar input[type="search"] {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <div class="topbar">
        <h1>Agent Memory Manager</h1>
        <div id="status" class="status">Ready</div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="shell">
    <div>
      <section>
        <div class="section-head">
          <h2 id="form-title">新增記憶</h2>
          <button class="secondary" type="button" id="reset-form">清空</button>
        </div>
        <form id="memory-form">
          <input type="hidden" id="memory-id">
          <label>Subject
            <input id="subject" required autocomplete="off" placeholder="user">
          </label>
          <label>Predicate
            <input id="predicate" required autocomplete="off" placeholder="prefers">
          </label>
          <label>Object
            <textarea id="object" required placeholder="Python"></textarea>
          </label>
          <div class="form-grid">
            <label>Type
              <input id="memory-type" value="fact">
            </label>
            <label>Scope
              <input id="scope" value="global">
            </label>
          </div>
          <div class="form-grid">
            <label>Confidence
              <input id="confidence" type="number" min="0" max="1" step="0.01" value="0.8">
            </label>
            <label>Expires At
              <input id="expires-at" placeholder="YYYY-MM-DD HH:MM:SS">
            </label>
          </div>
          <div class="actions">
            <button type="submit" id="submit-btn">儲存</button>
            <button class="secondary" type="button" id="reload-btn">重新整理</button>
          </div>
        </form>
      </section>

      <section class="tasks">
        <div class="section-head">
          <h2>最近任務</h2>
        </div>
        <div class="task-list" id="tasks"></div>
      </section>
    </div>

    <section>
      <div class="section-head">
        <h2>語意記憶</h2>
        <div class="toolbar">
          <input type="search" id="search" placeholder="搜尋 subject / predicate / object">
          <label><input type="checkbox" id="include-archived"> 顯示封存</label>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Fact</th>
              <th>Type</th>
              <th>Scope</th>
              <th>Confidence</th>
              <th>Updated</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="memory-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const state = { memories: [] };
    const $ = id => document.getElementById(id);

    function setStatus(message, isError = false) {
      const node = $('status');
      node.textContent = message;
      node.style.color = isError ? 'var(--red)' : 'var(--muted)';
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options
      });
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
      }
      return payload;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function formPayload() {
      return {
        subject: $('subject').value.trim(),
        predicate: $('predicate').value.trim(),
        object: $('object').value.trim(),
        memory_type: $('memory-type').value.trim() || 'fact',
        scope: $('scope').value.trim() || 'global',
        confidence: Number($('confidence').value),
        expires_at: $('expires-at').value.trim() || null
      };
    }

    function resetForm() {
      $('memory-id').value = '';
      $('subject').value = '';
      $('predicate').value = '';
      $('object').value = '';
      $('memory-type').value = 'fact';
      $('scope').value = 'global';
      $('confidence').value = '0.8';
      $('expires-at').value = '';
      $('form-title').textContent = '新增記憶';
      $('submit-btn').textContent = '儲存';
    }

    function editMemory(id) {
      const memory = state.memories.find(item => item.id === id);
      if (!memory) return;
      $('memory-id').value = memory.id;
      $('subject').value = memory.subject || '';
      $('predicate').value = memory.predicate || '';
      $('object').value = memory.object || '';
      $('memory-type').value = memory.memory_type || 'fact';
      $('scope').value = memory.scope || 'global';
      $('confidence').value = memory.confidence ?? 0.5;
      $('expires-at').value = memory.expires_at || '';
      $('form-title').textContent = `編輯記憶 #${memory.id}`;
      $('submit-btn').textContent = '更新';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function archiveMemory(id) {
      if (!confirm(`封存記憶 #${id}?`)) return;
      await api(`/api/memories/${id}`, {
        method: 'DELETE',
        body: JSON.stringify({ reason: 'web_management_delete' })
      });
      setStatus(`Archived memory #${id}`);
      await loadAll();
    }

    async function restoreMemory(id) {
      await api(`/api/memories/${id}/restore`, { method: 'POST', body: JSON.stringify({}) });
      setStatus(`Restored memory #${id}`);
      await loadAll();
    }

    function renderStats(stats) {
      $('stats').innerHTML = [
        ['Active Memories', stats.semantic_memory_count || 0],
        ['Low Confidence', stats.low_confidence_memory_count || 0],
        ['Procedures', stats.procedure_count || 0],
        ['Pending Tasks', stats.pending_tasks || 0],
        ['Failed Tasks', stats.failed_tasks || 0]
      ].map(([label, value]) => `
        <div class="stat"><strong>${escapeHtml(value)}</strong><span>${escapeHtml(label)}</span></div>
      `).join('');
    }

    function filteredMemories() {
      const term = $('search').value.trim().toLowerCase();
      if (!term) return state.memories;
      return state.memories.filter(memory =>
        [memory.subject, memory.predicate, memory.object, memory.memory_type, memory.scope]
          .some(value => String(value || '').toLowerCase().includes(term))
      );
    }

    function renderMemories() {
      const rows = filteredMemories();
      if (!rows.length) {
        $('memory-rows').innerHTML = '<tr><td colspan="7" class="empty">No memories found.</td></tr>';
        return;
      }
      $('memory-rows').innerHTML = rows.map(memory => {
        const archived = Boolean(memory.archived_at);
        const confidence = `${Math.round(Number(memory.confidence || 0) * 100)}%`;
        return `
          <tr class="${archived ? 'archived' : ''}">
            <td>#${memory.id}</td>
            <td class="fact">
              <strong>${escapeHtml(memory.subject)}</strong>
              ${escapeHtml(memory.predicate)}
              ${escapeHtml(memory.object)}
              ${archived ? `<div class="pill">封存：${escapeHtml(memory.archive_reason || '')}</div>` : ''}
            </td>
            <td><span class="pill">${escapeHtml(memory.memory_type)}</span></td>
            <td>${escapeHtml(memory.scope)}</td>
            <td>${confidence}</td>
            <td>${escapeHtml(memory.updated_at || memory.created_at || '')}</td>
            <td>
              <div class="row-actions">
                <button class="secondary" type="button" onclick="editMemory(${memory.id})">編輯</button>
                ${archived
                  ? `<button class="success" type="button" onclick="restoreMemory(${memory.id})">復原</button>`
                  : `<button class="danger" type="button" onclick="archiveMemory(${memory.id})">封存</button>`}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderTasks(tasks) {
      if (!tasks || !tasks.length) {
        $('tasks').innerHTML = '<div class="empty">No recent tasks.</div>';
        return;
      }
      $('tasks').innerHTML = tasks.slice(0, 8).map(task => `
        <div class="task">
          <div>${escapeHtml(task.text || 'Background task')}</div>
          <div class="task-meta">#${task.id} · ${escapeHtml(task.status)} · ${escapeHtml(task.created_at || '')}</div>
          ${task.last_error ? `<div class="task-meta" style="color:var(--red)">${escapeHtml(task.last_error)}</div>` : ''}
        </div>
      `).join('');
    }

    async function loadAll() {
      setStatus('Loading...');
      const includeArchived = $('include-archived').checked ? '1' : '0';
      const [stats, memories, tasks] = await Promise.all([
        api('/api/stats'),
        api(`/api/memories?limit=200&include_archived=${includeArchived}`),
        api('/api/tasks?limit=20')
      ]);
      state.memories = memories;
      renderStats(stats);
      renderMemories();
      renderTasks(tasks);
      setStatus(`Loaded ${memories.length} memories`);
    }

    $('memory-form').addEventListener('submit', async event => {
      event.preventDefault();
      try {
        const id = $('memory-id').value;
        const payload = formPayload();
        if (id) {
          await api(`/api/memories/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
          setStatus(`Updated memory #${id}`);
        } else {
          await api('/api/memories', { method: 'POST', body: JSON.stringify(payload) });
          setStatus('Created memory');
        }
        resetForm();
        await loadAll();
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    $('reset-form').addEventListener('click', resetForm);
    $('reload-btn').addEventListener('click', loadAll);
    $('include-archived').addEventListener('change', loadAll);
    $('search').addEventListener('input', renderMemories);

    loadAll().catch(error => setStatus(error.message, true));
  </script>
</body>
</html>

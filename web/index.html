<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python AI Agent Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            color: #fff;
        }

        .stat-label {
            color: #cbd5e1;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Main Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Lists */
        .list-container {
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbar */
        .list-container::-webkit-scrollbar {
            width: 6px;
        }
        .list-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 3px;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .list-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: background 0.2s ease;
        }

        .list-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .memory-text {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            font-weight: 600;
        }

        .badge.completed { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.failed { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge.running { background: rgba(59, 130, 246, 0.2); color: var(--accent-color); }
        .badge.pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        
        .loading {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agent Observatory</h1>
            <p class="subtitle">System Health & Live Monitoring</p>
        </header>

        <section class="stats-grid" id="stats-container">
            <div class="card stat-card"><div class="stat-value">...</div><div class="stat-label">Loading Stats</div></div>
        </section>

        <section class="main-grid">
            <div class="card">
                <h2>📝 Recent Semantic Memories</h2>
                <div class="list-container" id="memories-container">
                    <div class="loading">Loading memories...</div>
                </div>
            </div>

            <div class="card">
                <h2>⚡ Task Queue & History</h2>
                <div class="list-container" id="tasks-container">
                    <div class="loading">Loading tasks...</div>
                </div>
            </div>
        </section>
    </div>

    <script>
        async function fetchAPI(endpoint) {
            try {
                const res = await fetch(endpoint);
                if (!res.ok) throw new Error('API Error');
                return await res.json();
            } catch (e) {
                console.error('Failed to fetch', endpoint, e);
                return null;
            }
        }

        function renderStats(stats) {
            if (!stats) return;
            const container = document.getElementById('stats-container');
            container.innerHTML = `
                <div class="card stat-card">
                    <div class="stat-value">${stats.semantic_memory_count || 0}</div>
                    <div class="stat-label">Active Memories</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value">${stats.procedure_count || 0}</div>
                    <div class="stat-label">Procedures</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value">${stats.pending_tasks || 0} / ${stats.running_tasks || 0}</div>
                    <div class="stat-label">Pending / Running Tasks</div>
                </div>
                <div class="card stat-card">
                    <div class="stat-value">${stats.failed_tasks || 0}</div>
                    <div class="stat-label">Failed Tasks</div>
                </div>
            `;
        }

        function renderMemories(memories) {
            const container = document.getElementById('memories-container');
            if (!memories || memories.length === 0) {
                container.innerHTML = '<div class="loading">No active memories found.</div>';
                return;
            }
            container.innerHTML = memories.map(m => `
                <div class="list-item">
                    <div class="memory-text">${m.subject} ${m.predicate} ${m.object}</div>
                    <div class="meta">
                        <span>ID: #${m.id} | Conf: ${(m.confidence * 100).toFixed(0)}%</span>
                        <span>${new Date(m.created_at).toLocaleString()}</span>
                    </div>
                </div>
            `).join('');
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasks-container');
            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<div class="loading">No tasks found.</div>';
                return;
            }
            container.innerHTML = tasks.map(t => {
                const badgeClass = t.status === 'completed' ? 'completed' : 
                                  t.status === 'failed' ? 'failed' : 
                                  t.status === 'running' ? 'running' : 'pending';
                
                return `
                <div class="list-item">
                    <div class="memory-text">${t.text || 'Background Task'}</div>
                    ${t.error_message ? `<div style="color:var(--danger);font-size:0.8rem;margin-bottom:0.5rem;">Error: ${t.error_message}</div>` : ''}
                    <div class="meta">
                        <span class="badge ${badgeClass}">${t.status.toUpperCase()}</span>
                        <span>${new Date(t.created_at).toLocaleString()}</span>
                    </div>
                </div>
            `}).join('');
        }

        async function updateDashboard() {
            const [stats, memories, tasks] = await Promise.all([
                fetchAPI('/api/stats'),
                fetchAPI('/api/memories'),
                fetchAPI('/api/tasks')
            ]);
            
            renderStats(stats);
            renderMemories(memories);
            renderTasks(tasks);
        }

        // Init and refresh every 10 seconds
        updateDashboard();
        setInterval(updateDashboard, 10000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Architecture Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Next-Gen Agent Architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1060 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-arch-title agent-arch-desc">
        <title id="agent-arch-title">Next-Gen Agent Architecture</title>
        <desc id="agent-arch-desc">Overview of the autonomous agentic framework featuring multi-agent orchestration, sandbox execution, and dynamic web research.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <!-- Core Orchestration Zone -->
        <rect x="250" y="110" width="520" height="150" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="250" y="114" width="200" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="123" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CORE ORCHESTRATION</text>

        <!-- Tools & Execution Zone -->
        <rect x="250" y="280" width="770" height="250" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="250" y="284" width="200" height="12" rx="2" fill="#f5f5f5"/>
        <text x="350" y="293" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TOOLS &amp; EXECUTION</text>

        <!-- ARROWS -->
        <!-- User -> Main Agent -->
        <path d="M 200,192 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Main Agent -> Memory -->
        <path d="M 460,192 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        
        <!-- Main Agent -> Web RAG (exit top, enter left) -->
        <path d="M 370,160 V 72 Q 370,64 378,64 H 560" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        
        <!-- Main Agent -> Sub-agent Worker -->
        <path d="M 370,224 V 320" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        
        <!-- Sub-agent -> Sandbox -->
        <path d="M 460,352 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Sandbox -> Scaffold & Env -->
        <path d="M 740,352 H 820" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Sub-agent -> Browser Vision (exit bottom, enter left) -->
        <path d="M 370,384 V 456 Q 370,464 378,464 H 560" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- LABEL MASKS AND LABELS -->
        <!-- User -> Agent label -->
        <rect x="216" y="184" width="48" height="16" fill="#f5f5f5"/>
        <text x="240" y="195" font-family="'Geist Mono', monospace" font-size="10" font-weight="500" fill="#4f5d75" text-anchor="middle">REQUEST</text>

        <!-- Agent -> Web RAG label -->
        <!-- Label on vertical segment: x=370, y=(160+72)/2 = 116 -->
        <rect x="340" y="108" width="60" height="16" fill="#f5f5f5"/>
        <text x="370" y="119" font-family="'Geist Mono', monospace" font-size="10" font-weight="500" fill="#eb6c36" text-anchor="middle">RESEARCH</text>

        <!-- Agent -> Sub-agent label -->
        <!-- Label on vertical segment: y=(224+320)/2 = 272 -->
        <rect x="340" y="264" width="60" height="16" fill="#f5f5f5"/>
        <text x="370" y="275" font-family="'Geist Mono', monospace" font-size="10" font-weight="500" fill="#eb6c36" text-anchor="middle">DELEGATE</text>

        <!-- Sub-agent -> Sandbox label -->
        <rect x="476" y="344" width="68" height="16" fill="#f5f5f5"/>
        <text x="510" y="355" font-family="'Geist Mono', monospace" font-size="10" font-weight="500" fill="#4f5d75" text-anchor="middle">EXECUTE</text>

        <!-- NODES -->
        
        <!-- User Node -->
        <g transform="translate(60, 160)">
          <rect x="0" y="0" width="140" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="140" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#2d3142">User</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Prompt Input</text>
        </g>

        <!-- Main Agent Node (Focal - Coral) -->
        <g transform="translate(280, 160)">
          <rect x="0" y="0" width="180" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="180" height="64" fill="#eb6c36" stroke="#c95627" stroke-width="1.2" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Planner / Reviewer</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#fdece5">Main Agent</text>
        </g>

        <!-- Working Memory Node -->
        <g transform="translate(560, 160)">
          <rect x="0" y="0" width="180" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="180" height="64" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,4" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#2d3142">Short-Term Memory</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Context State</text>
        </g>

        <!-- Web Research RAG Node -->
        <g transform="translate(560, 32)">
          <rect x="0" y="0" width="180" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="180" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#2d3142">Dynamic Web RAG</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">tools/web_research.py</text>
        </g>

        <!-- Sub-agent Worker Node -->
        <g transform="translate(280, 320)">
          <rect x="0" y="0" width="180" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="180" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#2d3142">Sub-agent Coder</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Asynchronous Thread</text>
        </g>

        <!-- Docker Sandbox Node (Focal - Coral) -->
        <g transform="translate(560, 320)">
          <rect x="0" y="0" width="180" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="180" height="64" fill="#eb6c36" stroke="#c95627" stroke-width="1.2" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#ffffff">Sandbox Execution</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#fdece5">sandbox.py (Docker)</text>
        </g>

        <!-- Project Scaffold Node -->
        <g transform="translate(820, 320)">
          <rect x="0" y="0" width="180" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="180" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#2d3142">Bootstrapping Tools</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Scaffold &amp; Env Mgr</text>
        </g>

        <!-- Browser Vision Node -->
        <g transform="translate(560, 432)">
          <rect x="0" y="0" width="180" height="64" fill="#f5f5f5" rx="6"/>
          <rect x="0" y="0" width="180" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1.2" rx="6"/>
          <text x="16" y="28" font-family="'Geist', sans-serif" font-weight="600" font-size="14" fill="#2d3142">Browser &amp; Vision</text>
          <text x="16" y="46" font-family="'Geist Mono', monospace" font-size="11" fill="#4f5d75">Playwright DOM / VLM</text>
        </g>
        
      </svg>
    </div>
  </div>
</body>
</html>
